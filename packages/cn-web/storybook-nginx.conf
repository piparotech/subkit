events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        location /health {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status": "healthy"}';
        }

        location = /storybook {
            return 301 /storybook/;
        }

        # Storybook static (built with relative asset paths) served under /storybook/. root (not
        # alias) so try_files resolves cleanly; index.html fallback for the SPA routes.
        location /storybook/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /storybook/index.html;
            add_header Cache-Control "no-cache" always;
        }

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    }
}
