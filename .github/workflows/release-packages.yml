name: release packages

on:
  push:
    tags:
      - 'subkit-core-v*'
      - 'subkit-node-v*'
      - 'subkit-expo-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: subkit-package-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DIST_TAG: latest
      NPM_CONFIG_STORE_DIR: /tmp/subkit-pnpm-store
    steps:
      - name: Check out release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release package
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          release_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          node scripts/resolve-package-release-tag.mjs "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\nrelease_commit=%s\n' "$release_tag" "$release_commit" >> "$GITHUB_OUTPUT"

      - name: Require release commit on main
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org

      - name: Require trusted-publishing npm CLI
        run: |
          npm install --global npm@11.11.0
          test "$(npm --version)" = 11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package tarballs and clean consumers
        run: pnpm packages:verify

      - name: Pack selected release
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          mkdir .release
          pnpm --filter "$PACKAGE_NAME" pack --pack-destination .release
          archive="$(find .release -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          test "$(find .release -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = 1
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Refuse existing npm version
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        run: |
          env -u NODE_AUTH_TOKEN node scripts/check-public-package-version.mjs \
            "$PACKAGE_NAME" "$PACKAGE_VERSION" absent

      - name: Publish through npm trusted publishing
        run: npm publish "$archive" --access public --tag "$DIST_TAG"

      - name: Verify public npm metadata
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if env -u NODE_AUTH_TOKEN node scripts/check-public-package-version.mjs \
              "$PACKAGE_NAME" "$PACKAGE_VERSION" present; then
              exit 0
            fi
            sleep 15
          done
          echo "Public npm metadata did not converge for $PACKAGE_NAME@$PACKAGE_VERSION" >&2
          exit 1

      - name: Install exact public version in an anonymous clean consumer
        env:
          SUBKIT_NPM_REGISTRY: https://registry.npmjs.org/
          SUBKIT_RELEASE_PACKAGE: ${{ steps.release.outputs.package_slug }}
        run: env -u NODE_AUTH_TOKEN pnpm packages:verify:registry

      - name: Remove release artifacts
        if: ${{ always() }}
        run: rm -rf .release
