name: bootstrap packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: First npmjs package to publish
        required: true
        type: choice
        options:
          - core
          - node
          - expo

permissions:
  contents: read

concurrency:
  group: subkit-package-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_STORE_DIR: /tmp/subkit-pnpm-store
    steps:
      - name: Require trusted main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "${{ github.sha }}"

      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Resolve bootstrap package
        id: release
        env:
          DISPATCH_PACKAGE: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DISPATCH_PACKAGE" in
            core) directory=packages/subkit-core ;;
            node) directory=packages/subkit-node ;;
            expo) directory=packages/subkit-expo ;;
            *) echo "Unsupported bootstrap package: $DISPATCH_PACKAGE" >&2; exit 1 ;;
          esac
          version="$(node -p "require('./$directory/package.json').version")"
          node scripts/resolve-package-release-tag.mjs "subkit-$DISPATCH_PACKAGE-v$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm CLI
        run: |
          npm install --global npm@11.11.0
          test "$(npm --version)" = 11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package tarballs and clean consumers
        run: pnpm packages:verify

      - name: Pack selected release
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          mkdir .release
          pnpm --filter "$PACKAGE_NAME" pack --pack-destination .release
          archive="$(find .release -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          test "$(find .release -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = 1
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Refuse existing npm version
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>"$error_file"; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION already exists; bootstrap is no longer allowed" >&2
            rm -f "$error_file"
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found' "$error_file"; then
            echo "Could not prove $PACKAGE_NAME@$PACKAGE_VERSION is absent; refusing to publish" >&2
            cat "$error_file" >&2
            rm -f "$error_file"
            exit 1
          fi
          rm -f "$error_file"

      - name: Publish first npm version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm publish "$archive" --access public --tag latest --provenance

      - name: Verify public npm metadata
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            published="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            integrity="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            if [ "$published" = "$PACKAGE_VERSION" ] && [ -n "$integrity" ]; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Public npm metadata did not converge for $PACKAGE_NAME@$PACKAGE_VERSION" >&2
          exit 1

      - name: Install exact public version in an anonymous clean consumer
        env:
          SUBKIT_NPM_REGISTRY: https://registry.npmjs.org/
          SUBKIT_RELEASE_PACKAGE: ${{ steps.release.outputs.package_slug }}
        run: pnpm packages:verify:registry

      - name: Remove release artifacts
        if: ${{ always() }}
        run: rm -rf .release
